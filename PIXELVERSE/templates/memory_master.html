<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>PIXELVERSE | Memory Master</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

    <style>

        .memory-container {
            text-align: center;
            padding: 40px 20px;
        }

        .memory-container h1 {
            font-size: 42px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #9aa3c5;
            margin-bottom: 25px;
        }

        /* STATS */

        .stats {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-box {
            background: #151d35;
            border: 1px solid #293354;
            border-radius: 15px;
            padding: 15px 25px;
            min-width: 110px;
        }

        .stat-box strong {
            display: block;
            font-size: 22px;
        }

        .stat-box small {
            color: #8992b5;
        }

        /* MEMORY BOARD */

        .memory-board {
            width: 420px;
            max-width: 90vw;

            margin: auto;

            display: grid;
            grid-template-columns: repeat(4, 1fr);

            gap: 12px;
        }

        .card {
            height: 90px;

            border: none;
            border-radius: 12px;

            background: #293354;

            cursor: pointer;

            font-size: 35px;

            transition: transform 0.3s;
        }

        .card:hover {
            transform: scale(1.05);
        }

        .card.flipped {
            background: #7c5cff;
        }

        .card.matched {
            background: #334d75;
            cursor: default;
        }

        /* BUTTONS */

        .game-buttons {
            margin-top: 30px;
        }

        .restart-btn,
        .back-btn {

            display: inline-block;

            padding: 12px 25px;

            border: none;
            border-radius: 25px;

            color: white;

            font-weight: bold;

            text-decoration: none;

            cursor: pointer;

            margin: 5px;
        }

        .restart-btn {
            background: #7c5cff;
        }

        .back-btn {
            background: #293354;
        }

        /* MESSAGE */

        #message {
            margin-top: 20px;

            font-size: 20px;

            font-weight: bold;

            color: #b8c0dc;
        }

        /* WIN POPUP */

        .win-popup {

            display: none;

            position: fixed;

            inset: 0;

            background: rgba(5, 8, 20, 0.85);

            justify-content: center;

            align-items: center;

            z-index: 100;
        }

        .win-box {

            background: #151d35;

            border: 1px solid #7c5cff;

            border-radius: 20px;

            padding: 40px;

            text-align: center;

            animation: popup 0.4s ease;
        }

        .win-box h2 {
            font-size: 35px;
            margin-bottom: 15px;
        }

        .win-box p {
            color: #aab2d0;
            margin-bottom: 20px;
        }

        @keyframes popup {

            from {
                transform: scale(0.5);
                opacity: 0;
            }

            to {
                transform: scale(1);
                opacity: 1;
            }

        }

    </style>

</head>


<body>


<header>

    <div class="logo">
        🎮 <span>PIXEL</span>VERSE
    </div>

</header>


<div class="memory-container">

    <h1>🧠 MEMORY MASTER</h1>

    <p class="subtitle">
        Find all matching pairs!
    </p>


    <!-- STATS -->

    <div class="stats">

        <div class="stat-box">

            <strong id="moves">
                0
            </strong>

            <small>MOVES</small>

        </div>


        <div class="stat-box">

            <strong id="pairs">
                0 / 8
            </strong>

            <small>PAIRS</small>

        </div>


        <div class="stat-box">

            <strong id="score">
                0
            </strong>

            <small>SCORE</small>

        </div>

    </div>


    <!-- MEMORY BOARD -->

    <div class="memory-board" id="memoryBoard"></div>


    <div id="message">
        Find the matching cards!
    </div>


    <div class="game-buttons">

        <button
            class="restart-btn"
            onclick="startGame()">

            🔄 RESTART

        </button>


        <a
            href="/"
            class="back-btn">

            🏠 HOME

        </a>

    </div>

</div>


<!-- WIN POPUP -->

<div class="win-popup" id="winPopup">

    <div class="win-box">

        <h2>🎉 AMAZING!</h2>

        <p id="winText">
            You matched all pairs!
        </p>

        <button
            class="restart-btn"
            onclick="closePopup()">

            ▶ PLAY AGAIN

        </button>

    </div>

</div>


<script>

const symbols = [
    "🍎",
    "🍌",
    "🍇",
    "🍉",
    "🍓",
    "🍒",
    "🥝",
    "🍍"
];


let cards = [];

let firstCard = null;

let secondCard = null;

let lockBoard = false;

let moves = 0;

let matchedPairs = 0;

let score = 0;


/* START GAME */

function startGame() {

    cards = [
        ...symbols,
        ...symbols
    ];

    cards.sort(() => Math.random() - 0.5);


    firstCard = null;

    secondCard = null;

    lockBoard = false;

    moves = 0;

    matchedPairs = 0;

    score = 0;


    updateStats();


    const board =
        document.getElementById("memoryBoard");

    board.innerHTML = "";


    cards.forEach((symbol, index) => {

        const card =
            document.createElement("button");

        card.className = "card";

        card.dataset.symbol = symbol;

        card.dataset.index = index;

        card.innerText = "❓";

        card.onclick = () =>
            flipCard(card);

        board.appendChild(card);

    });


    document.getElementById("message")
        .innerText =
        "Find the matching cards!";

}


/* FLIP CARD */

function flipCard(card) {

    if (
        lockBoard ||
        card === firstCard ||
        card.classList.contains("matched")
    ) {
        return;
    }


    card.classList.add("flipped");

    card.innerText =
        card.dataset.symbol;


    if (!firstCard) {

        firstCard = card;

        return;

    }


    secondCard = card;

    moves++;

    updateStats();


    checkMatch();

}


/* CHECK MATCH */

function checkMatch() {

    const isMatch =
        firstCard.dataset.symbol ===
        secondCard.dataset.symbol;


    if (isMatch) {

        firstCard.classList.add("matched");

        secondCard.classList.add("matched");


        matchedPairs++;

        score += 100;


        firstCard = null;

        secondCard = null;


        updateStats();


        if (matchedPairs === 8) {

            setTimeout(showWin, 500);

        }

    }

    else {

        lockBoard = true;


        setTimeout(() => {

            firstCard.classList.remove("flipped");

            secondCard.classList.remove("flipped");

            firstCard.innerText = "❓";

            secondCard.innerText = "❓";


            firstCard = null;

            secondCard = null;

            lockBoard = false;

        }, 800);

    }

}


/* UPDATE STATS */

function updateStats() {

    document.getElementById("moves")
        .innerText = moves;


    document.getElementById("pairs")
        .innerText =
        matchedPairs + " / 8";


    document.getElementById("score")
        .innerText = score;

}


/* WIN */

function showWin() {

    document.getElementById("winText")
        .innerText =
        "You scored " + score + " points in " +
        moves + " moves!";


    document.getElementById("winPopup")
        .style.display = "flex";

}


/* CLOSE POPUP */

function closePopup() {

    document.getElementById("winPopup")
        .style.display = "none";

    startGame();

}


/* START */

startGame();

</script>


</body>

</html>
