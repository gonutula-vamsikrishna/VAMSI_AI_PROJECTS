<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>PIXELVERSE | Tic Tac Toe</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

    <style>

        .game-container {
            text-align: center;
            padding: 40px 20px;
        }

        .game-container h1 {
            font-size: 42px;
            margin-bottom: 10px;
        }

        .game-subtitle {
            color: #9aa3c5;
            margin-bottom: 25px;
        }

        /* SCORE */

        .score-board {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
        }

        .score {
            background: #151d35;
            border: 1px solid #293354;
            border-radius: 15px;
            padding: 15px 30px;
            min-width: 120px;
        }

        .score h3 {
            margin-bottom: 5px;
        }

        .score span {
            font-size: 25px;
            font-weight: bold;
        }

        /* BOARD */

        .board {
            width: 330px;
            height: 330px;

            margin: auto;

            display: grid;
            grid-template-columns: repeat(3, 1fr);

            gap: 8px;

            background: #293354;
            padding: 8px;

            border-radius: 15px;
        }

        .cell {
            background: #151d35;

            border: none;
            border-radius: 10px;

            font-size: 50px;
            font-weight: bold;

            color: white;

            cursor: pointer;

            transition: 0.2s;
        }

        .cell:hover {
            background: #202a4a;
            transform: scale(1.03);
        }

        .cell.winner {
            background: #7c5cff;
            animation: winner 0.6s infinite alternate;
        }

        @keyframes winner {

            from {
                transform: scale(1);
            }

            to {
                transform: scale(1.08);
            }

        }

        /* MESSAGE */

        #message {
            margin-top: 25px;

            font-size: 21px;
            font-weight: bold;

            color: #b8c0dc;
        }

        /* BUTTONS */

        .game-buttons {
            margin-top: 25px;
        }

        .restart-btn,
        .back-btn {

            display: inline-block;

            padding: 12px 25px;

            border: none;
            border-radius: 25px;

            color: white;

            font-weight: bold;

            text-decoration: none;

            cursor: pointer;

            margin: 5px;

        }

        .restart-btn {
            background: #7c5cff;
        }

        .back-btn {
            background: #293354;
        }

        .restart-btn:hover,
        .back-btn:hover {
            transform: scale(1.05);
        }

        /* WIN POPUP */

        .win-message {

            display: none;

            position: fixed;

            inset: 0;

            background: rgba(5, 8, 20, 0.85);

            justify-content: center;

            align-items: center;

            z-index: 100;

        }

        .win-box {

            background: #151d35;

            border: 1px solid #7c5cff;

            border-radius: 20px;

            padding: 45px;

            text-align: center;

            box-shadow: 0 0 50px rgba(124, 92, 255, 0.4);

            animation: popup 0.4s ease;

        }

        .win-box h2 {
            font-size: 35px;
            margin-bottom: 15px;
        }

        .win-box p {
            color: #aab2d0;
            margin-bottom: 25px;
        }

        @keyframes popup {

            from {
                transform: scale(0.5);
                opacity: 0;
            }

            to {
                transform: scale(1);
                opacity: 1;
            }

        }

    </style>

</head>


<body>


<header>

    <div class="logo">
        🎮 <span>PIXEL</span>VERSE
    </div>

</header>


<div class="game-container">

    <h1>❌⭕ TIC TAC TOE</h1>

    <p class="game-subtitle">
        Outsmart your opponent!
    </p>


    <!-- SCORE -->

    <div class="score-board">

        <div class="score">

            <h3>❌ X</h3>

            <span id="xScore">0</span>

        </div>


        <div class="score">

            <h3>⭕ O</h3>

            <span id="oScore">0</span>

        </div>


        <div class="score">

            <h3>🪙 Coins</h3>

            <span id="coins">0</span>

        </div>

    </div>


    <!-- BOARD -->

    <div class="board">

        <button class="cell" onclick="makeMove(0)"></button>
        <button class="cell" onclick="makeMove(1)"></button>
        <button class="cell" onclick="makeMove(2)"></button>

        <button class="cell" onclick="makeMove(3)"></button>
        <button class="cell" onclick="makeMove(4)"></button>
        <button class="cell" onclick="makeMove(5)"></button>

        <button class="cell" onclick="makeMove(6)"></button>
        <button class="cell" onclick="makeMove(7)"></button>
        <button class="cell" onclick="makeMove(8)"></button>

    </div>


    <div id="message">
        ❌ X's turn
    </div>


    <!-- BUTTONS -->

    <div class="game-buttons">

        <button
            class="restart-btn"
            onclick="restartGame()">

            🔄 RESTART

        </button>


        <a
            href="/"
            class="back-btn">

            🏠 HOME

        </a>

    </div>

</div>


<!-- WIN POPUP -->

<div class="win-message" id="winPopup">

    <div class="win-box">

        <h2 id="winTitle">
            🎉 YOU WIN!
        </h2>

        <p id="winText">
            Congratulations!
        </p>

        <button
            class="restart-btn"
            onclick="closePopup()">

            ▶ PLAY AGAIN

        </button>

    </div>

</div>


<script>

let board = [
    "", "", "",
    "", "", "",
    "", "", ""
];

let currentPlayer = "X";

let gameOver = false;

let xScore = 0;

let oScore = 0;

let coins = 0;


/* MAKE MOVE */

function makeMove(index) {

    if (board[index] !== "" || gameOver) {
        return;
    }


    board[index] = currentPlayer;


    const cells =
        document.querySelectorAll(".cell");

    cells[index].innerText =
        currentPlayer;


    if (checkWinner()) {

        gameOver = true;

        if (currentPlayer === "X") {

            xScore++;

            coins += 10;

            document.getElementById("xScore")
                .innerText = xScore;

            document.getElementById("coins")
                .innerText = coins;

            showWinner("🎉 X WINS!", "+10 🪙 Coins!");

        }

        else {

            oScore++;

            coins += 10;

            document.getElementById("oScore")
                .innerText = oScore;

            document.getElementById("coins")
                .innerText = coins;

            showWinner("🎉 O WINS!", "+10 🪙 Coins!");

        }

        return;
    }


    if (!board.includes("")) {

        gameOver = true;

        showWinner(
            "🤝 DRAW!",
            "Good game!"
        );

        return;
    }


    currentPlayer =
        currentPlayer === "X"
        ? "O"
        : "X";


    document.getElementById("message")
        .innerText =
        "👉 " + currentPlayer + "'s turn";

}


/* CHECK WINNER */

function checkWinner() {

    const winningPatterns = [

        [0, 1, 2],
        [3, 4, 5],
        [6, 7, 8],

        [0, 3, 6],
        [1, 4, 7],
        [2, 5, 8],

        [0, 4, 8],
        [2, 4, 6]

    ];


    const cells =
        document.querySelectorAll(".cell");


    for (let pattern of winningPatterns) {

        const [a, b, c] = pattern;


        if (
            board[a] !== "" &&
            board[a] === board[b] &&
            board[a] === board[c]
        ) {

            cells[a].classList.add("winner");

            cells[b].classList.add("winner");

            cells[c].classList.add("winner");

            return true;
        }

    }

    return false;

}


/* SHOW WINNER */

function showWinner(title, text) {

    document.getElementById("winTitle")
        .innerText = title;

    document.getElementById("winText")
        .innerText = text;

    document.getElementById("winPopup")
        .style.display = "flex";

}


/* CLOSE POPUP */

function closePopup() {

    document.getElementById("winPopup")
        .style.display = "none";

    restartBoard();

}


/* RESTART BOARD */

function restartBoard() {

    board = [
        "", "", "",
        "", "", "",
        "", "", ""
    ];

    currentPlayer = "X";

    gameOver = false;


    document
        .querySelectorAll(".cell")
        .forEach(cell => {

            cell.innerText = "";

            cell.classList.remove("winner");

        });


    document.getElementById("message")
        .innerText =
        "❌ X's turn";

}


/* RESTART GAME */

function restartGame() {

    restartBoard();

    xScore = 0;

    oScore = 0;

    coins = 0;


    document.getElementById("xScore")
        .innerText = "0";

    document.getElementById("oScore")
        .innerText = "0";

    document.getElementById("coins")
        .innerText = "0";

}

</script>


</body>

</html>
