<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>PIXELVERSE | Snake Rush</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

    <style>

        .snake-container {
            text-align: center;
            padding: 35px 20px;
        }

        .snake-container h1 {
            font-size: 42px;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #9aa3c5;
            margin-bottom: 20px;
        }

        .stats {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 25px;
        }

        .stat-box {
            background: #151d35;
            border: 1px solid #293354;
            border-radius: 15px;
            padding: 12px 25px;
            min-width: 110px;
        }

        .stat-box strong {
            display: block;
            font-size: 22px;
        }

        .stat-box small {
            color: #8992b5;
        }

        #gameCanvas {
            display: block;

            width: 400px;
            height: 400px;

            max-width: 90vw;
            max-height: 90vw;

            margin: auto;

            background: #080d1d;

            border: 4px solid #7c5cff;

            border-radius: 15px;

            box-shadow:
                0 0 30px rgba(124, 92, 255, 0.35);
        }

        #message {
            margin-top: 20px;

            font-size: 19px;

            font-weight: bold;

            color: #b8c0dc;
        }

        .controls {
            margin-top: 15px;
            color: #8992b5;
        }

        .game-buttons {
            margin-top: 20px;
        }

        .restart-btn,
        .back-btn {

            display: inline-block;

            padding: 12px 25px;

            border: none;

            border-radius: 25px;

            color: white;

            font-weight: bold;

            text-decoration: none;

            cursor: pointer;

            margin: 5px;
        }

        .restart-btn {
            background: #7c5cff;
        }

        .back-btn {
            background: #293354;
        }

        .restart-btn:hover,
        .back-btn:hover {
            transform: scale(1.05);
        }

        .game-over {

            display: none;

            position: fixed;

            inset: 0;

            background: rgba(5, 8, 20, 0.9);

            justify-content: center;

            align-items: center;

            z-index: 100;
        }

        .game-over-box {

            background: #151d35;

            border: 2px solid #7c5cff;

            border-radius: 20px;

            padding: 40px;

            text-align: center;
        }

        .game-over-box h2 {
            font-size: 35px;
            margin-bottom: 15px;
        }

        .game-over-box p {
            color: #aab2d0;
            margin-bottom: 20px;
        }

    </style>

</head>


<body>


<header>

    <div class="logo">
        🎮 <span>PIXEL</span>VERSE
    </div>

</header>


<div class="snake-container">

    <h1>🐍 SNAKE RUSH</h1>

    <p class="subtitle">
        Eat the food and become the longest snake!
    </p>


    <div class="stats">

        <div class="stat-box">

            <strong id="score">0</strong>

            <small>SCORE</small>

        </div>


        <div class="stat-box">

            <strong id="highScore">0</strong>

            <small>BEST</small>

        </div>


        <div class="stat-box">

            <strong id="coins">0</strong>

            <small>COINS</small>

        </div>

    </div>


    <canvas
        id="gameCanvas"
        width="400"
        height="400">
    </canvas>


    <div id="message">
        🐍 Snake is ready! Use the arrow keys.
    </div>


    <div class="controls">

        ⬆️ UP &nbsp;&nbsp;
        ⬇️ DOWN &nbsp;&nbsp;
        ⬅️ LEFT &nbsp;&nbsp;
        ➡️ RIGHT

    </div>


    <div class="game-buttons">

        <button
            class="restart-btn"
            onclick="startGame()">

            🔄 RESTART

        </button>


        <a
            href="/"
            class="back-btn">

            🏠 HOME

        </a>

    </div>

</div>


<div class="game-over" id="gameOver">

    <div class="game-over-box">

        <h2>💥 GAME OVER!</h2>

        <p id="finalScore">
            Score: 0
        </p>

        <button
            class="restart-btn"
            onclick="startGame()">

            ▶ PLAY AGAIN

        </button>

    </div>

</div>


<script>


const canvas =
    document.getElementById("gameCanvas");

const ctx =
    canvas.getContext("2d");


const gridSize = 20;

const gridCount = 20;


let snake = [];

let food = {};

let direction = "right";

let nextDirection = "right";

let score = 0;

let coins = 0;

let gameRunning = false;

let gameTimer;


let highScore =
    Number(localStorage.getItem("snakeHighScore")) || 0;


document.getElementById("highScore")
    .innerText = highScore;


/* =========================
   START GAME
========================= */

function startGame() {

    clearInterval(gameTimer);


    snake = [

        { x: 10, y: 10 },

        { x: 9, y: 10 },

        { x: 8, y: 10 }

    ];


    direction = "right";

    nextDirection = "right";


    score = 0;

    coins = 0;


    gameRunning = true;


    document.getElementById("score")
        .innerText = "0";


    document.getElementById("coins")
        .innerText = "0";


    document.getElementById("message")
        .innerText =
        "🐍 Use the arrow keys!";


    document.getElementById("gameOver")
        .style.display = "none";


    createFood();


    draw();


    gameTimer =
        setInterval(gameLoop, 150);

}


/* =========================
   GAME LOOP
========================= */

function gameLoop() {

    direction = nextDirection;


    const head = {

        x: snake[0].x,

        y: snake[0].y

    };


    if (direction === "up") {
        head.y--;
    }

    if (direction === "down") {
        head.y++;
    }

    if (direction === "left") {
        head.x--;
    }

    if (direction === "right") {
        head.x++;
    }


    /* WALL */

    if (

        head.x < 0 ||
        head.x >= gridCount ||
        head.y < 0 ||
        head.y >= gridCount

    ) {

        endGame();

        return;

    }


    /* BODY */

    for (let i = 0; i < snake.length; i++) {

        if (

            head.x === snake[i].x &&
            head.y === snake[i].y

        ) {

            endGame();

            return;

        }

    }


    snake.unshift(head);


    /* FOOD */

    if (

        head.x === food.x &&
        head.y === food.y

    ) {

        score += 10;

        coins += 2;


        document.getElementById("score")
            .innerText = score;


        document.getElementById("coins")
            .innerText = coins;


        createFood();

    }

    else {

        snake.pop();

    }


    draw();

}


/* =========================
   DRAW EVERYTHING
========================= */

function draw() {

    /* BACKGROUND */

    ctx.fillStyle = "#080d1d";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    /* GRID */

    ctx.strokeStyle = "#151d35";

    ctx.lineWidth = 1;


    for (let i = 0; i <= gridCount; i++) {

        ctx.beginPath();

        ctx.moveTo(
            i * gridSize,
            0
        );

        ctx.lineTo(
            i * gridSize,
            canvas.height
        );

        ctx.stroke();


        ctx.beginPath();

        ctx.moveTo(
            0,
            i * gridSize
        );

        ctx.lineTo(
            canvas.width,
            i * gridSize
        );

        ctx.stroke();

    }


    /* FOOD */

    ctx.fillStyle = "#ff4d6d";

    ctx.beginPath();

    ctx.arc(

        food.x * gridSize + 10,

        food.y * gridSize + 10,

        8,

        0,

        Math.PI * 2

    );

    ctx.fill();


    /* SNAKE */

    snake.forEach(function(part, index) {

        if (index === 0) {

            ctx.fillStyle = "#ffffff";

        }

        else {

            ctx.fillStyle = "#7c5cff";

        }


        ctx.fillRect(

            part.x * gridSize + 2,

            part.y * gridSize + 2,

            gridSize - 4,

            gridSize - 4

        );

    });


    /* HEAD EYES */

    const head = snake[0];


    ctx.fillStyle = "#080d1d";


    ctx.beginPath();

    ctx.arc(

        head.x * gridSize + 7,

        head.y * gridSize + 7,

        2,

        0,

        Math.PI * 2

    );

    ctx.fill();


    ctx.beginPath();

    ctx.arc(

        head.x * gridSize + 13,

        head.y * gridSize + 7,

        2,

        0,

        Math.PI * 2

    );

    ctx.fill();

}


/* =========================
   CREATE FOOD
========================= */

function createFood() {

    let valid = false;


    while (!valid) {

        food = {

            x: Math.floor(
                Math.random() * gridCount
            ),

            y: Math.floor(
                Math.random() * gridCount
            )

        };


        valid = true;


        for (let part of snake) {

            if (

                part.x === food.x &&
                part.y === food.y

            ) {

                valid = false;

                break;

            }

        }

    }

}


/* =========================
   KEYBOARD
========================= */

document.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "ArrowUp") {

            if (direction !== "down") {

                nextDirection = "up";

            }

        }


        if (event.key === "ArrowDown") {

            if (direction !== "up") {

                nextDirection = "down";

            }

        }


        if (event.key === "ArrowLeft") {

            if (direction !== "right") {

                nextDirection = "left";

            }

        }


        if (event.key === "ArrowRight") {

            if (direction !== "left") {

                nextDirection = "right";

            }

        }


        event.preventDefault();

    }
);


/* =========================
   GAME OVER
========================= */

function endGame() {

    gameRunning = false;


    clearInterval(gameTimer);


    if (score > highScore) {

        highScore = score;


        localStorage.setItem(
            "snakeHighScore",
            highScore
        );


        document.getElementById("highScore")
            .innerText = highScore;

    }


    document.getElementById("finalScore")
        .innerText =
        "Score: " + score +
        " | 🪙 Coins: +" + coins;


    document.getElementById("gameOver")
        .style.display = "flex";

}


/* START */

startGame();


</script>


</body>

</html>
